[package]
name = "vigil-mock-ft"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-contract-standards = "5.30.0"
near-sdk = { version = "5.30.0", features = ["legacy"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
overflow-checks = true
panic = "abort"
strip = true
